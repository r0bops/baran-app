name: CI Gates — Build & Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typescript-build:
    name: TypeScript — Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build venrescate-core-ts
        working-directory: packages/venrescate-core-ts
        run: npm install && npm run build
      - name: Build coordinator-web
        working-directory: apps/coordinator-web
        run: npm install && npx tsc --noEmit && npx vite build

  kotlin-build:
    name: Kotlin — Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Build venrescate-core (includes vector + adversarial tests)
        run: ./gradlew :venrescate-core:build

  security-suite:
    name: Security — adversarial + functional suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build venrescate-core-ts (required by the backend tests)
        working-directory: packages/venrescate-core-ts
        run: npm install && npm run build
      - name: Core adversarial suite
        working-directory: packages/venrescate-core-ts
        run: npm run test:security
      - name: API seam integration test
        run: node test/integration-test.mjs
      - name: Backend functional test (auth/RBAC/persistence/bridge)
        working-directory: packages/venrescate-api-server
        run: npm test
      - name: Backend adversarial suite
        working-directory: packages/venrescate-api-server
        run: npm run test:security
