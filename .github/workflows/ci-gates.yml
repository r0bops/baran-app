name: CI Gates — Build & Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typescript-build:
    name: TypeScript — Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build baran-core-ts
        working-directory: packages/baran-core-ts
        run: npm install && npm run build
      - name: Build coordinator-web
        working-directory: apps/coordinator-web
        run: npm install && npx tsc --noEmit && npx vite build

  kotlin-build:
    name: Kotlin — Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Build baran-core
        run: ./gradlew :baran-core:build
