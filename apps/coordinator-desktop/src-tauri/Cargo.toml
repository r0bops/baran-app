[package]
name = "baran-coordinator"
version = "0.1.0"
description = "Baran Coordinator — Tauri 2 desktop app"
authors = ["Baran Rescue Project"]
edition = "2021"

[lib]
name = "baran_coordinator_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# OS keychain for the coordinator signing key (Keychain / Credential Manager / SecretService)
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
